name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
      - name: gofmt (format check)
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "::error::gofmt: unformatted files: $out"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go build
        run: go build ./...

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
          cache: true
      - name: Install ONNX Runtime (shared library for the integration tests)
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install onnxruntime
      - name: Run tests (offline + integration)
        shell: bash
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: |
          export ICHKIL_ONNXRUNTIME_LIB=$(python -c "import onnxruntime; print(onnxruntime.get_library_path())")
          go test -v -count=1 ./...

  test-min-go:
    # Prove the module still builds and passes the offline suite on the
    # minimum supported Go version (go.mod: go 1.21). Integration tests
    # skip automatically without ONNX Runtime.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
      - name: go build
        run: go build ./...
      - name: go test (offline suite; integration tests skip)
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: go test -v -count=1 ./...
